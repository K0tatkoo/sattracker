# Orbit for iPhone and iPad. The Xcode project is generated from this file:
#   cd ios && xcodegen
# so the project stays readable text; Orbit.xcodeproj is committed so it also
# opens straight in Xcode.
#
# A native app since 2.0.0: the globe is drawn with Metal, the chrome is
# SwiftUI in Liquid Glass, and the orbits come from OrbitCore (satellite.js's
# SGP4 ported to Swift, checked against it). The iPhone version has its own
# version numbers; the Android app's releases do not change them.
name: Orbit
options:
  bundleIdPrefix: com.kotatko
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  OrbitCore:
    path: OrbitCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "2"
    CODE_SIGN_STYLE: Automatic
targets:
  Orbit:
    type: application
    platform: iOS
    sources:
      - path: Orbit
      - path: Shared
      # The Earth map and the offline orbits are the Android app's own files,
      # used in place rather than copied.
      - path: ../app/src/main/assets/lib/earth-dark.jpg
        buildPhase: resources
      - path: ../app/src/main/assets/tle
        type: folder
        buildPhase: resources
    dependencies:
      - package: OrbitCore
      - target: OrbitWidget
    entitlements:
      path: Orbit/Orbit.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.kotatko.sattracker
    info:
      path: Orbit/Info.plist
      properties:
        CFBundleDisplayName: Orbit
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocationWhenInUseUsageDescription: >-
          Orbit puts you on the globe and works out when satellites pass over you.
          Your location stays on this device.
        # Pass alerts are planned again when iOS grants a background moment.
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.kotatko.sattracker.passes
        # The widget opens the app on a satellite: sattracker://sat/25544
        CFBundleURLTypes:
          - CFBundleURLName: com.kotatko.sattracker
            CFBundleURLSchemes:
              - sattracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kotatko.sattracker
        PRODUCT_NAME: Orbit
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  OrbitWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: OrbitWidget
      - path: Shared
    dependencies:
      - package: OrbitCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: OrbitWidget/OrbitWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.kotatko.sattracker
    info:
      path: OrbitWidget/Info.plist
      properties:
        CFBundleDisplayName: Orbit
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        # Without the App Group (a free Apple ID) the widget finds its own location.
        NSWidgetWantsLocation: true
        NSLocationWhenInUseUsageDescription: >-
          The widget works out when the ISS passes over you. Your location stays on this device.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kotatko.sattracker.widget
        PRODUCT_NAME: OrbitWidget
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
