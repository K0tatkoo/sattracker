# Orbit for iPhone. The Xcode project is generated from this file:
#   cd ios && xcodegen
# so the project stays readable text; Orbit.xcodeproj is committed so it also
# opens straight in Xcode.
name: Orbit
options:
  bundleIdPrefix: com.kotatko
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Orbit:
    type: application
    platform: iOS
    sources:
      - path: Orbit
      # The page itself is the Android app's, used in place rather than copied,
      # so the two apps can never show different things.
      - path: ../app/src/main/assets
        type: folder
        buildPhase: resources
    info:
      path: Orbit/Info.plist
      properties:
        CFBundleDisplayName: Orbit
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocationWhenInUseUsageDescription: >-
          Orbit puts you on the globe and works out when satellites pass over you.
          Your location stays on this iPhone.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kotatko.sattracker
        PRODUCT_NAME: Orbit
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
